name: Run tests
permissions:
  checks: write
  pull-requests: write
concurrency:
  group: pr-cg-${{ github.ref }}
  cancel-in-progress: true
jobs:
  run_playwright_tests:
    uses: ./.github/workflows/run-playwright-tests.yml
    secrets: inherit
  run_tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3.6.0
      with:
        fetch-depth: 0
    - name: Cache local Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    - name: Cache local npm dependencies
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: temurin
        cache: gradle
    - name: Build and run tests
      env:
        GENERATE_SOURCEMAP: false
        CI: false
      run: ./gradlew odd-platform-api:build ${{ github.event.inputs.buildOptions }} --no-daemon --scan -PbundleUI=false
    - name: Publish test reports
      uses: EnricoMi/publish-unit-test-result-action@v1
      if: always()
      with:
        files: odd-platform-api/build/test-results/**/*.xml
        check_name: Test Results
        comment_mode: create new
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_dispatch: null
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
  push:
    branches:
    - debug/**
